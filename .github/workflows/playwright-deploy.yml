name: Playwright Test & Deploy Report

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        id: tests
        continue-on-error: true
        env:
          BASE_URL: ${{ secrets.BASE_URL }}

          GIAOVU_USER: ${{ secrets.GIAOVU_USER }}
          GIAOVU_PASS: ${{ secrets.GIAOVU_PASS }}

          GVHD_USER: ${{ secrets.GVHD_USER }}
          GVHD_PASS: ${{ secrets.GVHD_PASS }}

          NCS_USER: ${{ secrets.NCS_USER }}
          NCS_PASS: ${{ secrets.NCS_PASS }}

          NCS_NEW_USER: ${{ secrets.NCS_NEW_USER }}
          NCS_NEW_PASS: ${{ secrets.NCS_NEW_PASS }}

          DOC_ID_OF_OTHER_NCS: ${{ secrets.DOC_ID_OF_OTHER_NCS }}

        run: npx playwright test

      - name: Upload Playwright HTML Report
        id: upload
        if: always() && hashFiles('playwright-report/index.html') != ''
        uses: actions/upload-pages-artifact@v4
        with:
          path: playwright-report/

      - name: Deploy to GitHub Pages
        id: deployment
        if: always() && steps.upload.outcome == 'success'
        uses: actions/deploy-pages@v4

      - name: Preserve test failure status
        if: always() && steps.tests.outcome == 'failure'
        run: exit 1
